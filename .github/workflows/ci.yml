name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Pin ruff to the same version as local dev (0.6.2) — newer ruff
          # releases enable new rules that fire on the existing codebase.
          pip install "ruff==0.6.2" pytest pytest-asyncio httpx

      - name: Ruff lint
        run: ruff check app/ tests/ tunnel.py mcp_servers/

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-that-is-at-least-32-characters-long
          # PostgresDsn-validated; tests use in-memory ASGITransport so the
          # URL is never actually connected.
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          MOCK_EXTERNAL_APIS: "true"
        run: |
          python -m pytest tests/ -q --tb=short

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile.api -t lankaagent-api:ci .

      - name: Build MCP image
        run: docker build -f mcp_servers/Dockerfile -t lankaagent-mcp:ci mcp_servers/
