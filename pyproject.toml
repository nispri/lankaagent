[project]
name = "lankaagent-api"
version = "0.1.0"
description = "LankaAgent API Gateway + Travel Agent + Operator CRM"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Hermes Agent", email = "hermes@lankaagent.com"}]
maintainers = [{name = "Nishantha Priyadarshana", email = "nishantha.priyadarshana@gmail.com"}]
keywords = ["travel", "ai", "agent", "sri-lanka", "tourism", "whatsapp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "gunicorn==21.2.0",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.12.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "pydantic-extra-types==2.7.0",
    "langgraph==0.1.20",
    "langchain-core==0.2.35",
    "langchain-openai==0.1.20",
    "openai==1.30.0",
    "httpx==0.27.0",
    "tenacity==8.2.3",
    "twilio==8.10.0",
    "stripe==7.8.0",
    "google-auth==2.29.0",
    "google-api-python-client==2.118.0",
    "google-auth-oauthlib==1.2.0",
    "structlog==24.1.0",
    "prometheus-client==0.19.0",
    "posthog==3.5.0",
    "sentry-sdk[fastapi]==1.45.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "jinja2==3.1.4",
    "babel==2.14.0",
    "pytz==2024.1",
    "python-dateutil==2.9.0",
    "email-validator==2.1.0",
    "mcp==0.2.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
show_error_context = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy", "sqlalchemy.mypy"]
exclude = ["venv", ".venv", ".mypy_cache", "build", "dist", "*.egg-info", "__pycache__", ".git", "scripts", "alembic"]

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "api: API tests",
    "agent: Agent tests",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "alembic"]
skips = ["B101", "B104", "B108", "B110", "B604", "B607", "B608"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*", "alembic/*", "app/main.py"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]
show_missing = true
precision = 2