# LankaAgent — Docker Compose (Production-Ready)
# Run: docker compose -f docker-compose.yml up -d
# Staging: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d

version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # DATABASE LAYER
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lankaagent-postgres
    environment:
      POSTGRES_DB: lankaagent
      POSTGRES_USER: ${POSTGRES_USER:-lankaagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lankaagent_dev_pass}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lankaagent} -d lankaagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - lankaagent-internal

  redis:
    image: redis:7-alpine
    container_name: lankaagent-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - lankaagent-internal

  # ─────────────────────────────────────────────────────────────
  # APPLICATION LAYER
  # ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile.api
      target: development
    container_name: lankaagent-api
    environment:
      # Core
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lankaagent}:${POSTGRES_PASSWORD:-lankaagent_dev_pass}@postgres:5432/lankaagent
      - REDIS_URL=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek-v4-flash-free}
      - ZEN_API_KEY=${ZEN_API_KEY:-}
      - ZEN_BASE_URL=${ZEN_BASE_URL:-https://opencode.ai/zen/v1}
      - ZEN_MODEL=${ZEN_MODEL:-deepseek-v4-flash-free}
      - SECRET_KEY=${SECRET_KEY:-this-is-a-dev-secret-key-that-is-at-least-32-char}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DEFAULT_TENANT_SCHEMA=public
      - MOCK_EXTERNAL_APIS=true
      - LOG_LEVEL=debug
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - lankaagent-internal
      - lankaagent-external
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: production
    container_name: lankaagent-worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lankaagent}:${POSTGRES_PASSWORD}@postgres:5432/lankaagent
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - MCP_SERVER_URL=http://mcp:8000
      - MCP_API_KEY=${MCP_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - lankaagent-internal
    restart: unless-stopped
    # Scale with: docker compose up -d --scale worker=3

  mcp:
    build:
      context: ./mcp_servers
      dockerfile: Dockerfile
    container_name: lankaagent-mcp
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lankaagent}:${POSTGRES_PASSWORD}@postgres:5432/lankaagent
      - MCP_API_KEY=${MCP_API_KEY}
      - LOG_LEVEL=info
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "http://localhost:8000/mcp", "-H", "Content-Type: application/json", "-H", "Accept: application/json, text/event-stream", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"hc\",\"version\":\"1\"}}}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - lankaagent-internal
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # FRONTEND / DASHBOARD
  # ─────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: production
    container_name: lankaagent-dashboard
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - lankaagent-external
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # OBSERVABILITY
  # ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2
    container_name: lankaagent-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - lankaagent-internal
      - lankaagent-external
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47
    container_name: lankaagent-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - lankaagent-internal
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9
    container_name: lankaagent-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - lankaagent-internal
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # REVERSE PROXY / SSL (Production)
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: lankaagent-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - dashboard
      - grafana
    networks:
      - lankaagent-external
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: lankaagent-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - lankaagent-external

networks:
  lankaagent-internal:
    driver: bridge
    internal: false
  lankaagent-external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:
  loki_data: